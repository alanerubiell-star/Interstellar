<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kirkland Promo</title>
<style>
  @font-face { font-family: 'Anton'; src: url(assets/fonts/Anton.ttf); }
  @font-face { font-family: 'Archivo Black'; src: url(assets/fonts/ArchivoBlack.ttf); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(assets/fonts/Inter-500.ttf); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(assets/fonts/Inter-800.ttf); }

  :root {
    --red: #e31837; --yellow: #ffd400; --ink: #0b0b0d; --green: #06c167;
    --purple: #4b2477; --coffee: #b80f26; --blue: #1666b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: 'Inter', sans-serif; color: #fff; position: relative; }

  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }
  .mask { overflow: hidden; display: block; padding-top: 24px; margin-top: -24px; }
  .mask > span { display: inline-block; }
  .center { left: 0; right: 0; text-align: center; }
  .anton { font-family: 'Anton', sans-serif; line-height: .95; letter-spacing: 1px; }
  .archivo { font-family: 'Archivo Black', sans-serif; }

  /* ---------- scene 1: intro ---------- */
  #s1 { background: #000; }
  #s1 .bg { inset: -120px; background: url(assets/collage.png) center/cover; }
  #s1 .shade { inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.85) 55%, #000); }
  #kirk { top: 560px; font-size: 250px; }
  #sig  { top: 800px; }
  #sig span { font-family: 'Archivo Black'; font-size: 104px; color: var(--red); transform: skewX(-12deg); display: inline-block; }
  #sigline { top: 935px; left: 250px; width: 580px; height: 12px; background: var(--red); transform-origin: left; }
  #l1 { top: 1080px; font-size: 96px; }
  #l2 { top: 1190px; font-size: 150px; }
  #hl { top: 1330px; left: 130px; width: 820px; height: 26px; background: var(--yellow); transform-origin: left; }

  /* ---------- product scenes ---------- */
  .prod .stripes { inset: -200px; background: repeating-linear-gradient(-35deg, rgba(255,255,255,.06) 0 40px, transparent 40px 110px); }
  .prod .topline { top: 110px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-weight: 800; font-size: 38px; letter-spacing: 6px; }
  .prod .card { top: 250px; left: 170px; width: 740px; height: 740px; background: #fff; border-radius: 48px; box-shadow: 0 40px 90px rgba(0,0,0,.45); padding: 30px; }
  .prod .card img { width: 100%; height: 100%; object-fit: contain; }
  .prod .sticker { top: 190px; left: 740px; width: 280px; height: 280px; border-radius: 50%; background: var(--yellow); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,.35); }
  .prod .sticker b { font-family: 'Inter'; font-weight: 800; font-size: 40px; letter-spacing: 2px; }
  .prod .sticker i { font-style: normal; font-family: 'Anton'; font-size: 104px; line-height: 1; }
  .prod .title { top: 1060px; font-size: 118px; }
  .prod .sub { top: 1200px; font-size: 48px; font-weight: 500; opacity: .92; }
  .prod .old { top: 1330px; font-weight: 800; font-size: 84px; color: rgba(255,255,255,.75); }
  .prod .old .strike { position: absolute; left: -12px; right: -12px; top: 50%; height: 10px; background: var(--yellow); transform-origin: left; }
  .prod .new { top: 1420px; font-family: 'Anton'; font-size: 330px; line-height: 1; color: var(--yellow); text-shadow: 0 16px 0 rgba(0,0,0,.25); }
  #s2 { background: var(--purple); }
  #s3 { background: var(--coffee); }
  #s4 { background: var(--blue); }

  /* ---------- scene 5: delivery ---------- */
  #s5 { background: #000; }
  #uber { top: 150px; left: 90px; width: 900px; height: 783px; border-radius: 44px; overflow: hidden; box-shadow: 0 30px 80px rgba(6,193,103,.25); }
  #uber img { width: 100%; height: 100%; object-fit: cover; }
  #r1 { top: 990px; font-size: 130px; }
  #r2 { top: 1115px; font-size: 130px; }
  #mins { top: 1265px; display: flex; justify-content: center; align-items: center; gap: 28px; }
  #mins .num { font-family: 'Anton'; font-size: 230px; color: var(--green); line-height: 1; width: 260px; text-align: right; }
  #mins .pill { background: #fff; color: var(--ink); border-radius: 60px; padding: 22px 40px; font-weight: 800; font-size: 54px; line-height: 1.05; }
  #ubar { top: 1620px; left: 0; width: 1080px; height: 190px; background: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 96px; color: #000; letter-spacing: -2px; transform-origin: left; }

  /* ---------- scene 6: end card ---------- */
  #s6 { background: #fff; color: var(--ink); }
  #logo { top: 170px; left: 140px; width: 800px; }
  #k1 { top: 470px; font-size: 128px; }
  #k2 { top: 610px; font-size: 52px; font-weight: 500; color: #333; }
  .thumbs { top: 760px; left: 60px; right: 60px; display: flex; justify-content: space-between; }
  .thumb { width: 300px; text-align: center; }
  .thumb .ph { width: 300px; height: 300px; border-radius: 28px; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.14); padding: 16px; }
  .thumb .ph img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .p { font-family: 'Anton'; font-size: 96px; color: var(--red); margin-top: 22px; line-height: 1; }
  .thumb .o { font-weight: 800; font-size: 40px; color: #777; text-decoration: line-through; text-decoration-thickness: 4px; margin-top: 6px; }
  #cta { top: 1340px; left: 240px; width: 600px; height: 150px; border-radius: 80px; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 66px; letter-spacing: 1px; box-shadow: 0 20px 44px rgba(227,24,55,.4); }
  #band { top: 1640px; left: 0; width: 1080px; height: 200px; background: #13226b; display: flex; align-items: center; justify-content: center; }
  #band span { background: var(--red); color: #fff; font-family: 'Archivo Black'; font-size: 48px; padding: 18px 36px; white-space: nowrap; transform: rotate(-2deg); display: inline-block; }

  /* ---------- global fx ---------- */
  #wipebar { top: -200px; height: 2400px; width: 90px; background: var(--yellow); }
  #flash { inset: 0; background: #fff; pointer-events: none; }
</style>
</head>
<body>

<!-- 1 · Intro -->
<section class="scene" id="s1">
  <div class="abs bg" id="s1bg"></div>
  <div class="abs shade"></div>
  <div class="abs center anton" id="kirk">KIRKLAND</div>
  <div class="abs center mask" id="sig"><span>Signature</span></div>
  <div class="abs" id="sigline"></div>
  <div class="abs center mask anton" id="l1"><span>PRODUCTOS DE LA</span></div>
  <div class="abs" id="hl"></div>
  <div class="abs center mask anton" id="l2"><span>MEJOR CALIDAD</span></div>
</section>

<!-- 2-4 · Products (filled by script) -->
<section class="scene prod" id="s2"></section>
<section class="scene prod" id="s3"></section>
<section class="scene prod" id="s4"></section>

<!-- 5 · Delivery -->
<section class="scene" id="s5">
  <div class="abs" id="uber"><img src="assets/uber.png" alt=""></div>
  <div class="abs center mask anton" id="r1"><span>RECIBE TUS</span></div>
  <div class="abs center mask anton" id="r2"><span>FAVORITOS</span></div>
  <div class="abs center" id="mins"><div class="num" id="num">0</div><div class="pill" id="pill">MINUTOS<br>O MENOS</div></div>
  <div class="abs" id="ubar">Uber Eats</div>
</section>

<!-- 6 · End card -->
<section class="scene" id="s6">
  <img class="abs" id="logo" src="assets/logo.png" alt="">
  <div class="abs center mask anton" id="k1"><span>KIRKLAND SIGNATURE</span></div>
  <div class="abs center mask" id="k2"><span>Productos de la mejor calidad</span></div>
  <div class="abs thumbs">
    <div class="thumb" id="t0"><div class="ph"><img src="assets/cat.png"></div><div class="p">$499</div><div class="o">$699</div></div>
    <div class="thumb" id="t1"><div class="ph"><img src="assets/coffee.png"></div><div class="p">$319</div><div class="o">$419</div></div>
    <div class="thumb" id="t2"><div class="ph"><img src="assets/dog.png"></div><div class="p">$859</div><div class="o">$1,199</div></div>
  </div>
  <div class="abs" id="cta">VER TODO</div>
  <div class="abs" id="band"><span>Descuentos exclusivos para socios</span></div>
</section>

<div class="abs" id="wipebar"></div>
<div class="abs" id="flash"></div>

<script>
const W = 1080, H = 1920;
const DURATION = 17.5;

const PRODUCTS = [
  { id: 's2', start: 2,  img: 'cat',    n: '01', title: 'ALIMENTO PARA GATO',  sub: 'Pollo y Arroz · 11.3 kg',        now: '$499', was: '$699',   save: '$200' },
  { id: 's3', start: 5,  img: 'coffee', n: '02', title: 'CAFÉ EN GRANO',       sub: 'Gourmet Tostado Francés · 1 kg', now: '$319', was: '$419',   save: '$100' },
  { id: 's4', start: 8,  img: 'dog',    n: '03', title: 'ALIMENTO PARA PERRO', sub: 'Salmón y Camote · 15.87 kg',     now: '$859', was: '$1,199', save: '$340' },
];
for (const p of PRODUCTS) {
  document.getElementById(p.id).innerHTML = `
    <div class="abs stripes"></div>
    <div class="abs topline"><span>KIRKLAND SIGNATURE</span><span>${p.n} / 03</span></div>
    <div class="abs card"><img src="assets/${p.img}.png" alt=""></div>
    <div class="abs sticker"><b>AHORRA</b><i>${p.save}</i></div>
    <div class="abs center mask anton title"><span>${p.title}</span></div>
    <div class="abs center mask sub"><span>${p.sub}</span></div>
    <div class="abs center old"><span style="position:relative;display:inline-block">${p.was}<i class="strike"></i></span></div>
    <div class="abs center new">${p.now}</div>`;
}

// ---- tween helpers ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: k => k,
  outExpo: k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k),
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outBack: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
};
const tw = (t, t0, d, e = E.outExpo) => e(clamp((t - t0) / d));
const shake = (t, t0, amp = 22, d = .3) => {
  const k = (t - t0) / d; if (k < 0 || k > 1) return [0, 0];
  const a = amp * (1 - k) * (1 - k);
  return [a * Math.sin(t * 95), a * Math.cos(t * 71)];
};
const $ = (sel, root = document) => root.querySelector(sel);
function set(el, { x = 0, y = 0, s = 1, sx, r = 0, o = 1 } = {}) {
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx !== undefined ? sx + ',' + s : s})`;
  el.style.opacity = o;
}
// masked line: rise from below
const rise = (el, t, t0, d = .4) => set(el.firstElementChild, { y: lerp(el.offsetHeight * 1.05, 0, tw(t, t0, d)) });
// diagonal wipe: scene visible for p in (0,1]
function wipe(el, p) {
  const L = (1 - p) * (W + 500);
  el.style.clipPath = p >= 1 ? 'none' : `polygon(${L}px 0, ${W + 500}px 0, ${W + 500}px ${H}px, ${L - 500}px ${H}px)`;
  el.style.visibility = p <= 0 ? 'hidden' : 'visible';
}

const scenes = ['s1', 's2', 's3', 's4', 's5', 's6'].map(id => document.getElementById(id));
const CUTS = [0, 2, 5, 8, 11, 14]; // scene start times (all on the beat @120bpm)
const WIPE = .38;

function render(t) {
  // scene visibility + wipes
  scenes.forEach((el, i) => {
    const p = i === 0 ? 1 : tw(t, CUTS[i], WIPE, E.inOutCubic);
    wipe(el, p);
    const next = CUTS[i + 1];
    if (next !== undefined && t >= next + WIPE) el.style.visibility = 'hidden';
  });
  // yellow bar riding the wipe edge
  const bar = $('#wipebar');
  const active = CUTS.slice(1).find(c => t >= c && t < c + WIPE);
  if (active !== undefined) {
    const p = tw(t, active, WIPE, E.inOutCubic);
    const L = (1 - p) * (W + 500);
    bar.style.opacity = 1;
    bar.style.transform = `translate(${L - 290}px,0) skewX(${Math.atan2(500, H) * 180 / Math.PI}deg)`;
  } else bar.style.opacity = 0;

  // flash on first frame + hard hits
  const flashes = [0, 3.5, 6.5, 9.5];
  $('#flash').style.opacity = Math.max(...flashes.map(f => t >= f ? (1 - tw(t, f, .22, E.lin)) * (f === 0 ? 1 : .35) : 0));

  // ---- S1 intro ----
  {
    set($('#s1bg'), { s: lerp(1.28, 1.08, tw(t, 0, 2.4, E.outCubic)) });
    const [sx, sy] = shake(t, .32, 26);
    const k = tw(t, .05, .32);
    set($('#kirk'), { s: lerp(2.6, 1, k), o: clamp(k * 3), x: sx, y: sy });
    rise($('#sig'), t, .4, .35);
    set($('#sigline'), { sx: tw(t, .55, .35), s: 1 });
    rise($('#l1'), t, .85, .35);
    rise($('#l2'), t, 1.05, .35);
    set($('#hl'), { sx: tw(t, 1.3, .3), s: 1, y: 0 });
  }

  // ---- S2–S4 products ----
  for (const p of PRODUCTS) {
    const S = p.start, root = document.getElementById(p.id);
    if (t < S - .1 || t > S + 3.6) continue;
    $('.stripes', root).style.transform = `translateX(${((t - S) * 120) % 134}px)`;
    const kt = tw(t, S + .25, .4);
    set($('.topline', root), { y: lerp(-60, 0, kt), o: kt });
    const kc = tw(t, S + .12, .6);
    const drift = tw(t, S + .7, 2.5, E.lin);
    const [sx, sy] = shake(t, S + 1.5, 24);
    set($('.card', root), { x: lerp(1100, 0, kc) + sx, y: sy, r: lerp(14, -3, kc) + drift * 1.5, s: lerp(1, 1.04, drift) });
    rise($('.title', root), t, S + .5, .35);
    rise($('.sub', root), t, S + .65, .35);
    const ko = tw(t, S + 1.0, .3);
    set($('.old', root), { y: lerp(40, 0, ko), o: ko });
    set($('.strike', root), { sx: tw(t, S + 1.25, .22, E.outCubic), s: 1 });
    const kn = tw(t, S + 1.5, .28);
    set($('.new', root), { s: lerp(3.2, 1, kn), o: clamp(kn * 4), x: sx * .6, y: sy * .6 });
    const ks = tw(t, S + 1.85, .45, E.outBack);
    set($('.sticker', root), { s: Math.max(0, ks), r: lerp(-200, -12, clamp(ks)) + Math.sin((t - S) * 5) * 3 * clamp(ks) });
  }

  // ---- S5 delivery ----
  if (t > 10.8) {
    const ku = tw(t, 11.15, .6);
    set($('#uber'), { y: lerp(900, 0, ku), s: lerp(.9, 1, ku) * lerp(1, 1.03, tw(t, 11.7, 2.3, E.lin)) });
    rise($('#r1'), t, 11.4, .35);
    rise($('#r2'), t, 11.55, .35);
    const kn = tw(t, 11.9, .7, E.outCubic);
    $('#num').textContent = Math.round(90 * kn);
    const [sx, sy] = shake(t, 12.5, 18);
    set($('#num'), { o: clamp((t - 11.85) * 8), s: 1 + .18 * (1 - tw(t, 12.5, .25)) * (t >= 12.5 ? 1 : 0), x: sx, y: sy });
    const kp = tw(t, 12.45, .4, E.outBack);
    set($('#pill'), { s: Math.max(0, kp), r: lerp(-8, -3, clamp(kp)) });
    set($('#ubar'), { sx: tw(t, 12.9, .4), s: 1 });
  }

  // ---- S6 end card ----
  if (t > 13.8) {
    const kl = tw(t, 14.3, .5, E.outBack);
    set($('#logo'), { s: Math.max(0, kl), o: clamp(kl * 3) });
    rise($('#k1'), t, 14.6, .35);
    rise($('#k2'), t, 14.75, .35);
    [0, 1, 2].forEach(i => {
      const k = tw(t, 15.0 + i * .12, .45, E.outBack);
      set($('#t' + i), { y: lerp(160, 0, clamp(k)), s: lerp(.6, 1, k), o: clamp(k * 3) });
    });
    const kc = tw(t, 15.55, .45, E.outBack);
    const pulse = t > 16 ? 1 + .06 * Math.max(0, Math.sin((t - 16) * Math.PI * 2)) : 1;
    set($('#cta'), { s: Math.max(0, kc) * pulse });
    set($('#band'), { y: lerp(260, 0, tw(t, 15.75, .45)) });
  }
}

window.DURATION = DURATION;
window.render = render;
render(0);
</script>
</body>
</html>
